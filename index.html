<style>
/* Layout: left menu + one calm column of cards on desktop; the menu becomes a bottom bar on phones */
:root{
  --bg:#f3f7f8;--surface:#ffffff;--ink:#13292c;--muted:#556f73;--line:#d5e2e3;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-soft:#d9f3ef;
  --lav:#ede9fe;--lav-ink:#5b21b6;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#a16207;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a1c;--surface:#14262a;--ink:#e8f2f2;--muted:#95b0b3;--line:#27413f;
  --accent:#2dd4bf;--accent-ink:#06211f;--accent-soft:#12403d;
  --lav:#2a2347;--lav-ink:#c4b5fd;
  --ok:#4ade80;--ok-soft:#12361f;--warn:#fbbf24;--warn-soft:#3a2f0e;--bad:#f87171;--bad-soft:#431818;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1c;--surface:#14262a;--ink:#e8f2f2;--muted:#95b0b3;--line:#27413f;
  --accent:#2dd4bf;--accent-ink:#06211f;--accent-soft:#12403d;
  --lav:#2a2347;--lav-ink:#c4b5fd;
  --ok:#4ade80;--ok-soft:#12361f;--warn:#fbbf24;--warn-soft:#3a2f0e;--bad:#f87171;--bad-soft:#431818;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,input,select,label{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;padding:4px 12px 18px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.side a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:16px;min-height:46px}
.side a svg{width:22px;height:22px;flex:none}
.side a:hover{background:var(--accent-soft);color:var(--ink)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lav-ink);outline-offset:2px}
main{padding:32px clamp(16px,4vw,48px) 56px;max-width:900px;width:100%;display:grid;gap:18px;align-content:start;min-width:0}
a{color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card.hero{background:var(--accent-soft);border-color:transparent;text-align:center;padding:28px 20px}
.eyebrow{margin:0;color:var(--muted);font-weight:600;font-size:15px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(44px,12vw,68px);line-height:1.1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;font-size:15px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.lav{background:var(--lav);color:var(--lav-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .k{margin:0;color:var(--muted);font-size:14px;font-weight:600}
.stat .v{margin:4px 0 0;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.good .v{color:var(--ok)}.stat.bad .v{color:var(--bad)}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over>i{background:var(--bad)}
form.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;margin-top:12px}
label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%;min-width:0}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;min-height:46px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
button.small{padding:6px 12px;min-height:36px;font-size:15px}
.list{display:grid;gap:0;margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.list li:first-child{border-top:0}
.list .grow{flex:1 1 150px;min-width:0;overflow-wrap:anywhere}

.list .meta{display:block;color:var(--muted);font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--lav);color:var(--lav-ink);white-space:nowrap}
.months{display:flex;flex-wrap:wrap;gap:8px}
.months button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:8px 14px;min-height:42px}
.months button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:18px 0 6px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal .dow{font-size:13px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;overflow:hidden;min-width:0;background:var(--surface)}
.cal .day.blank{border-color:transparent;background:transparent}
.cal .day.pay{background:var(--ok-soft)}
.cal .day.today{outline:2.5px solid var(--lav-ink)}
.cal .n{font-weight:700;font-size:14px;display:block}
.cal .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cal .t.p{color:var(--ok);font-weight:700}.cal .t.b{color:var(--warn)}.cal .t.s{color:var(--muted)}
.lg.p{color:var(--ok);font-weight:700}.lg.b{color:var(--warn);font-weight:700}.lg.s{color:var(--muted);font-weight:700}
.navrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;max-width:calc(100vw - 32px);z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.toast[hidden]{display:none}
.note{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cmp{background:var(--bg);border-radius:12px;padding:14px}
.cmp b{font-family:var(--display)}
@media (max-width:760px){
  body{font-size:17px}
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;justify-content:flex-start;gap:0;padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .side::-webkit-scrollbar{display:none}
  .brand{display:none}
  .side a{flex:0 0 auto;min-width:68px;flex-direction:column;gap:2px;padding:6px 6px;font-size:12px;min-height:54px;justify-content:center;text-align:center;white-space:nowrap;scroll-snap-align:center}
  main{padding-top:20px;padding-bottom:120px}
  .toast{bottom:92px}
  button.small{min-height:44px;padding:8px 14px}
  .navrow button.small{min-width:44px}
  .months button{min-height:44px}
  .cal .day{min-height:58px}.cal .t{font-size:10px}
  .list li .small{flex:0 0 auto}
}
@media (max-width:380px){
  main{padding-left:12px;padding-right:12px}
  .card{padding:16px}
  .cal{gap:2px}.cal .day{padding:2px}
}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}button{transition:filter .15s}}
</style>

<div class="app">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
var KEY="adhd-budget-planner-v1";
var CATS=["Groceries","Eating out","Transport","Home","Health","Fun","Shopping","Other"];
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var FREQ={weekly:"Every week",biweekly:"Every 2 weeks",monthly:"Every month"};
var DEF={v:1,setup:{name:"",pay:0,next:"",freq:"biweekly",theme:"auto",cur:"$"},tx:[],bills:[],paid:{},funds:[],debts:[],extra:0,wait:[],example:false};
var memOnly=false;

/* ---------- small helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function dayDiff(a,b){return Math.round((a-b)/864e5);}
function fmtDate(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});}
function fmtLong(d){return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});}
function money(n){n=+n||0;return (n<0?"-":"")+S.setup.cur+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(v){var t=String(v).trim().replace(/,/g,"");if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t))return NaN;var n=parseFloat(t);return isFinite(n)?n:NaN;}
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

/* ---------- storage ---------- */
function merge(p){
  var o=clone(DEF);
  if(!p||typeof p!=="object")return o;
  Object.keys(o).forEach(function(k){
    if(k==="setup"){o.setup=Object.assign({},DEF.setup,p.setup||{});}
    else if(Array.isArray(o[k])){o[k]=Array.isArray(p[k])?p[k]:[];}
    else if(k==="paid"){o.paid=(p.paid&&typeof p.paid==="object"&&!Array.isArray(p.paid))?p.paid:{};}
    else if(p[k]!==undefined){o[k]=p[k];}
  });
  var isStr=function(v){return typeof v==="string"&&v.length>0;},fin=function(v){return typeof v==="number"&&isFinite(v);},DATE=/^\d{4}-\d{2}-\d{2}$/;
  o.tx=o.tx.filter(function(t){return t&&isStr(t.name)&&fin(t.amount)&&t.amount>0&&(t.type==="spend"||t.type==="income")&&DATE.test(t.date||"");}).map(function(t){t.id=isStr(t.id)?t.id:uid();t.cat=isStr(t.cat)?t.cat:"Other";return t;});
  o.bills=o.bills.filter(function(b){return b&&isStr(b.name)&&fin(b.amount)&&b.amount>0&&fin(b.due)&&b.due>=1&&b.due<=31;}).map(function(b){b.id=isStr(b.id)?b.id:uid();b.due=Math.floor(b.due);return b;});
  o.funds=o.funds.filter(function(f){return f&&isStr(f.name)&&fin(f.target)&&f.target>0&&fin(f.saved)&&f.saved>=0&&fin(f.per)&&f.per>=0;}).map(function(f){f.id=isStr(f.id)?f.id:uid();f.saved=Math.min(f.saved,f.target);return f;});
  o.debts=o.debts.filter(function(d){return d&&isStr(d.name)&&fin(d.balance)&&d.balance>0&&fin(d.apr)&&d.apr>=0&&d.apr<=100&&fin(d.min)&&d.min>=0;}).map(function(d){d.id=isStr(d.id)?d.id:uid();return d;});
  o.wait=o.wait.filter(function(w){return w&&isStr(w.name)&&fin(w.price)&&w.price>0&&fin(w.hours)&&w.hours>0&&fin(w.created)&&(w.status==="wait"||w.status==="skipped"||w.status==="bought");}).map(function(w){w.id=isStr(w.id)?w.id:uid();return w;});
  Object.keys(o.paid).forEach(function(k){if(o.paid[k]!==true)delete o.paid[k];});
  o.setup.name=typeof o.setup.name==="string"?o.setup.name.slice(0,30):"";
  o.setup.cur=typeof o.setup.cur==="string"&&o.setup.cur?o.setup.cur.slice(0,3):"$";
  if(typeof o.setup.next!=="string"||(o.setup.next&&!DATE.test(o.setup.next)))o.setup.next="";
  if(["auto","light","dark"].indexOf(o.setup.theme)<0)o.setup.theme="auto";
  o.example=o.example===true;
  o.setup.pay=isFinite(+o.setup.pay)&&+o.setup.pay>=0?+o.setup.pay:0;
  o.extra=isFinite(+o.extra)&&+o.extra>=0?+o.extra:0;
  if(!FREQ[o.setup.freq])o.setup.freq="biweekly";
  return o;
}
function load(){try{var r=localStorage.getItem(KEY);if(r)return merge(JSON.parse(r));}catch(e){}return clone(DEF);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));memOnly=false;}catch(e){memOnly=true;}}
var S=load();
var UI={y:new Date().getFullYear(),m:new Date().getMonth(),cy:new Date().getFullYear(),cm:new Date().getMonth()};

/* ---------- pay cycle ---------- */
function period(f){return f==="weekly"?7:f==="monthly"?30:14;}
function addP(d,f,sign){var x=new Date(d);if(f==="monthly"){x.setMonth(x.getMonth()+sign);}else{x.setDate(x.getDate()+sign*period(f));}return x;}
function cycle(){
  if(!S.setup.next||!(S.setup.pay>0))return null;
  var next=parse(S.setup.next);if(isNaN(next))return null;
  var t=today(),g=0;
  while(next<=t&&g++<2000)next=addP(next,S.setup.freq,1);
  var start=addP(next,S.setup.freq,-1);
  return {start:start,next:next,days:Math.max(1,dayDiff(next,t)),len:Math.max(1,dayDiff(next,start))};
}
function billsIn(c){
  var out=[],y=c.start.getFullYear(),m=c.start.getMonth();
  for(var k=0;k<3;k++){
    var yy=y+Math.floor((m+k)/12),mm=(m+k)%12;
    S.bills.forEach(function(b){
      var d=new Date(yy,mm,Math.min(b.due,dim(yy,mm)));
      if(d>=c.start&&d<c.next){var key=b.id+"|"+iso(d);out.push({b:b,due:d,key:key,paid:!!S.paid[key]});}
    });
  }
  out.sort(function(a,b){return a.due-b.due;});
  return out;
}
function sum(a,f){return a.reduce(function(s,x){return s+f(x);},0);}
function figures(){
  var c=cycle();if(!c)return null;
  var bl=billsIn(c),billsTotal=sum(bl,function(x){return x.b.amount;});
  var fundsPer=sum(S.funds,function(f){return f.per;}),debtPer=sum(S.debts,function(d){return d.min;});
  var pool=Math.max(0,S.setup.pay-billsTotal-fundsPer-debtPer);
  var s0=iso(c.start),s1=iso(c.next);
  var spent=sum(S.tx.filter(function(t){return t.type==="spend"&&t.date>=s0&&t.date<s1;}),function(t){return t.amount;});
  var left=Math.max(0,pool-spent),daily=left/c.days,short=S.setup.pay-billsTotal-fundsPer-debtPer<0;
  var perDay=pool/c.len,ratio=perDay>0?daily/perDay:0,state;
  if(short)state=["bad","Plans are bigger than your paycheck"];
  else if(spent>pool)state=["bad","Over budget. Pause extras"];
  else if(ratio<0.6)state=["warn","Tight. Essentials only"];
  else if(ratio<1.3)state=["ok","On track"];
  else state=["ok","Comfortable. Room for a treat"];
  return {c:c,bl:bl,billsTotal:billsTotal,fundsPer:fundsPer,debtPer:debtPer,pool:pool,spent:spent,left:left,daily:daily,state:state,short:short};
}

/* ---------- debt payoff ---------- */
function simDebt(strategy){
  var days=period(S.setup.freq);
  var items=S.debts.map(function(d,i){return {i:i,bal:d.balance,apr:d.apr/100,min:d.min};});
  var order=items.filter(function(x){return x.bal>0;}).sort(strategy==="snowball"?function(a,b){return a.bal-b.bal||a.i-b.i;}:function(a,b){return b.apr-a.apr||a.i-b.i;});
  var budget=sum(items,function(x){return x.min;})+S.extra,interest=0,n=0;
  while(items.some(function(x){return x.bal>0.005;})&&n<600){
    n++;var paid=0;
    items.forEach(function(x){var i=x.bal*x.apr*days/365;interest+=i;x.bal+=i;var p=Math.min(x.min,x.bal);x.bal-=p;paid+=p;});
    var pool=budget-paid;
    for(var k=0;k<order.length&&pool>0;k++){var x=order[k];if(x.bal>0.005){var p=Math.min(pool,x.bal);x.bal-=p;pool-=p;}}
  }
  return {n:n,interest:interest,done:!items.some(function(x){return x.bal>0.005;}),order:order.map(function(x){return S.debts[x.i].name;})};
}

/* ---------- feedback ---------- */
var toastT;
function toast(msg,bad){var t=$("#toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},bad?5000:2600);}
function commit(msg){save();render();if(msg)toast(msg);if(memOnly)toast("Your browser blocked saving. Use Setup > Back up my data.",true);}

/* ---------- icons ---------- */
var ICON={
 today:'<path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/>',
 money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 bills:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 savings:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 010 3.5h-3a1.8 1.8 0 000 3.5h4"/>',
 debt:'<path d="M4 20h16M6 20v-8M12 20V5M18 20v-5"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 wait:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 setup:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'
};
var TABS=[["today","Today"],["money","Money"],["bills","Bills"],["savings","Savings"],["debt","Debt"],["calendar","Calendar"],["wait","Wait list"],["setup","Setup"]];
function tab(){var h=(location.hash||"").replace("#","");return ICON[h]?h:"today";}

/* ---------- views ---------- */
function welcome(){
  return '<h1>Welcome</h1><section class="card"><h2>Two quick steps</h2><p class="sub">1. Tell me your paycheck and your next payday.<br>2. Add your bills. That is all. I will show you what is safe to spend each day.</p>'+
  '<p style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0"><button data-act="goSetup">Set up my paycheck</button><button class="ghost" data-act="example">Try it with example data</button></p></section>';

function viewToday(){

  S=merge({setup:{name:"Alex",pay:2450,next:d(9),freq:"biweekly",theme:S.setup.theme,cur:S.setup.cur||"$"},example:true,
   bills:[["Rent",1100,1],["Internet",75,8],["Electricity",115,12],["Car insurance",130,14],["Phone",65,18],["Streaming",16.99,20]].map(function(b){return {id:uid(),name:b[0],amount:b[1],due:b[2]};}),
   tx:[["Groceries",142.5,"Groceries",-4],["Gas",48,"Transport",-3],["Pharmacy",30,"Health",-2],["Takeout",38.5,"Eating out",-1],["Coffee beans",22,"Eating out",0]].map(function(x){return {id:uid(),type:"spend",name:x[0],amount:x[1],cat:x[2],date:d(x[3])};}).concat([{id:uid(),type:"income",name:"Paycheck",amount:2450,cat:"",date:d(-5)}]),
   funds:[["Car repairs",1200,750,75],["Vet fund",800,520,50],["Holiday gifts",600,310,40]].map(function(f){return {id:uid(),name:f[0],target:f[1],saved:f[2],per:f[3]};}),
   debts:[["Credit card",1420,22.9,120],["Student loan",6800,4.5,95],["Car loan",4100,3.9,185]].map(function(x){return {id:uid(),name:x[0],balance:x[1],apr:x[2],min:x[3]};}),
   extra:100,wait:[{id:uid(),name:"Mechanical keyboard",price:149,hours:48,created:Date.now()-22*36e5,status:"wait"}]});
  commit("Example data loaded");
}
function save_file(name,text,mime){
  return Promise.resolve().then(function(){
    if(window.claude&&claude.use)return claude.use("downloads").then(function(dl){if(dl)return dl.save({filename:name,data:text}).then(function(){return true;});return false;});
    return false;
  }).catch(function(e){if(e&&e.code==="declined")return true;return false;}).then(function(done){
    if(done)return;
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  });
}
function posAmt(v,label){var n=num(v);if(!isFinite(n)||n<=0){toast(label+" must be a number above 0.",true);return NaN;}return Math.round(n*100)/100;}
function needName(v){v=String(v||"").trim();if(!v){toast("Please type a name first.",true);return "";}return v;}
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"")||isNaN(parse(v))){toast("Please pick a date.",true);return "";}return v;}

var FORMS={
 spend:function(f){var n=needName(f.name.value);if(!n)return;var a=posAmt(f.amount.value,"The amount");if(isNaN(a))return;var d=validDate(f.date.value);if(!d)return;
   S.tx.push({id:uid(),type:"spend",name:n,amount:a,cat:f.cat.value,date:d});commit("Added "+money(a)+" for "+n);},
 income:function(f){var n=needName(f.name.value);if(!n)return;var a=posAmt(f.amount.value,"The amount");if(isNaN(a))return;var d=validDate(f.date.value);if(!d)return;
   S.tx.push({id:uid(),type:"income",name:n,amount:a,cat:"",date:d});commit("Added "+money(a)+" coming in");},
 bill:function(f){var n=needName(f.name.value);if(!n)return;var a=posAmt(f.amount.value,"The amount");if(isNaN(a))return;var d=parseInt(f.due.value,10);
   if(!(d>=1&&d<=31)||String(f.due.value).trim()!==String(d)){toast("Due day must be a whole number from 1 to 31.",true);return;}
   S.bills.push({id:uid(),name:n,amount:a,due:d});commit("Bill added");},
 fund:function(f,sub){var n=needName(f.name.value);if(!n)return;var t=posAmt(f.target.value,"The goal");if(isNaN(t))return;
   var sv=f.saved.value.trim()===""?0:num(f.saved.value),pr=f.per.value.trim()===""?0:num(f.per.value);
   if(!isFinite(sv)||sv<0){toast("Saved so far must be 0 or more.",true);return;}if(!isFinite(pr)||pr<0){toast("Amount each paycheck must be 0 or more.",true);return;}
   S.funds.push({id:uid(),name:n,target:t,saved:Math.min(sv,t)||0,per:pr});commit("Fund added");},
 deposit:function(f,sub){var fd=S.funds.filter(function(x){return x.id===f.dataset.id;})[0];if(!fd)return;var a=posAmt(f.amount.value,"The amount");if(isNaN(a))return;
   if(sub==="take"){if(a>fd.saved){toast("You only have "+money(fd.saved)+" in this fund.",true);return;}fd.saved=Math.round((fd.saved-a)*100)/100;commit("Took out "+money(a));}
   else{fd.saved=Math.min(fd.target,Math.round((fd.saved+a)*100)/100);commit("Added "+money(a));}},
 debt:function(f){var n=needName(f.name.value);if(!n)return;var b=posAmt(f.balance.value,"The amount owed");if(isNaN(b))return;
   var r=num(f.apr.value);if(!isFinite(r)||r<0||r>100){toast("Yearly interest must be between 0 and 100.",true);return;}
   var m=f.min.value.trim()===""?0:num(f.min.value);if(!isFinite(m)||m<0){toast("Minimum must be 0 or more.",true);return;}
   S.debts.push({id:uid(),name:n,balance:b,apr:r,min:m});commit("Debt added");},
 extra:function(f){var v=f.amount.value.trim()===""?0:num(f.amount.value);if(!isFinite(v)||v<0){toast("Extra must be 0 or more.",true);return;}S.extra=v;commit("Plan updated");},
 wait:function(f){var n=needName(f.name.value);if(!n)return;var p=posAmt(f.price.value,"The price");if(isNaN(p))return;
   S.wait.push({id:uid(),name:n,price:p,hours:parseInt(f.hours.value,10)||48,created:Date.now(),status:"wait"});commit("On your wait list. Check back later.");},
 setup:function(f,sub){var p=f.pay.value.trim()===""?0:num(f.pay.value);if(!isFinite(p)||p<0){toast("Pay must be a number, 0 or more.",true);return;}
   if(f.next.value&&isNaN(parse(f.next.value))){toast("Please pick a valid payday.",true);return;}
   S.setup.name=f.name.value.trim();S.setup.pay=p;S.setup.next=f.next.value;S.setup.freq=f.freq.value;S.setup.cur=(f.cur.value.trim()||"$").slice(0,3);S.setup.theme=f.theme.value;
   if(sub==="auto"){save();applyTheme();if(memOnly)toast("Your browser blocked saving. Use Back up my data.",true);else toast("Saved");return;}
   commit("Saved");}
};
var ACTS={
 goSetup:function(){location.hash="#setup";},
 example:exampleData,
 year:function(e){UI.y+=parseInt(e.dataset.d,10);render();},
 month:function(e){UI.m=parseInt(e.dataset.m,10);render();},
 calnav:function(e){UI.cm+=parseInt(e.dataset.d,10);if(UI.cm<0){UI.cm=11;UI.cy--;}if(UI.cm>11){UI.cm=0;UI.cy++;}render();},
 pay:function(e){var k=e.dataset.key;if(S.paid[k])delete S.paid[k];else S.paid[k]=true;commit("Bill marked paid");},
 delTx:function(e){S.tx=S.tx.filter(function(t){return t.id!==e.dataset.id;});commit("Deleted");},
 delBill:function(e){var id=e.dataset.id;S.bills=S.bills.filter(function(b){return b.id!==id;});Object.keys(S.paid).forEach(function(k){if(k.indexOf(id+"|")===0)delete S.paid[k];});commit("Bill deleted");},
 delFund:function(e){S.funds=S.funds.filter(function(x){return x.id!==e.dataset.id;});commit("Fund deleted");},
 delDebt:function(e){S.debts=S.debts.filter(function(x){return x.id!==e.dataset.id;});commit("Debt deleted");},
 delWait:function(e){S.wait=S.wait.filter(function(x){return x.id!==e.dataset.id;});commit("Removed");},
 skip:function(e){var w=S.wait.filter(function(x){return x.id===e.dataset.id;})[0];if(w){w.status="skipped";commit("Great choice. You kept "+money(w.price));}},
 buy:function(e){var w=S.wait.filter(function(x){return x.id===e.dataset.id;})[0];if(w){w.status="bought";S.tx.push({id:uid(),type:"spend",name:w.name,amount:w.price,cat:"Fun",date:iso(today())});commit("Added to your spending");}},
 export:function(){save_file("adhd-budget-planner-backup-"+iso(today())+".json",JSON.stringify(S,null,2),"application/json").then(function(){toast("Backup ready");});},
 reset:function(){var b=$("#confirmBox");b.hidden=false;b.innerHTML='Erase all your data on this device? <button class="small danger" data-act="resetYes">Yes, erase</button> <button class="small ghost" data-act="resetNo">Cancel</button>';},
 resetYes:function(){S=clone(DEF);location.hash="#today";commit("Everything erased");},
 resetNo:function(){var b=$("#confirmBox");b.hidden=true;b.innerHTML="";}
};
document.addEventListener("click",function(ev){var el=ev.target.closest("[data-act]");if(!el)return;var a=ACTS[el.dataset.act];if(a){ev.preventDefault();a(el);}});
document.addEventListener("submit",function(ev){var f=ev.target.closest("form[data-form]");if(!f)return;ev.preventDefault();var h=FORMS[f.dataset.form];if(h)h(f,ev.submitter&&ev.submitter.value);});
document.addEventListener("change",function(ev){
  if(ev.target.id==="importFile"){
    var file=ev.target.files&&ev.target.files[0];if(!file)return;var r=new FileReader();
    r.onload=function(){try{var p=JSON.parse(r.result);if(!p||typeof p!=="object"||Array.isArray(p)||!p.setup||!Array.isArray(p.tx)||!Array.isArray(p.bills))throw new Error("shape");S=merge(p);commit("Backup restored");}catch(e){toast("That file is not a backup from this planner.",true);}ev.target.value="";};
    r.onerror=function(){toast("Could not read that file.",true);};r.readAsText(file);return;}
  var f=ev.target.closest("#setupForm");if(f){FORMS.setup(f,"auto");}
});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
setInterval(function(){if(tab()==="wait"&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))render();},30000);
render();
})();
</script>
</body></html>
